<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="t">
  <title id="t">Riftmap: an offline atlas of disclosed bug bounty reports</title>
  <defs>
    <radialGradient id="bg" cx="0.3" cy="0.4" r="0.9">
      <stop offset="0" stop-color="#122029"/>
      <stop offset="1" stop-color="#0a0f14"/>
    </radialGradient>
    <linearGradient id="hot" x1="-20" y1="16" x2="22" y2="-16" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1fb89d"/>
      <stop offset="1" stop-color="#5ff5dc"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <!-- faint background dial -->
  <g transform="translate(1120 320)" fill="none" stroke="#16252e">
    <circle r="300" stroke-width="2"/>
    <circle r="230" stroke-width="10" stroke-dasharray="2 22"/>
    <circle r="160" stroke-width="2"/>
  </g>

  <!-- mark -->
  <g transform="translate(270 320) scale(1.9)">
    <circle r="60" fill="none" stroke="#2a4250" stroke-width="5" stroke-dasharray="1.4 6.45"/>
    <g stroke="#3d6070" stroke-width="2.4" stroke-linecap="round">
      <path d="M0 -64V-55"/><path d="M64 0H55"/><path d="M0 64V55"/><path d="M-64 0H-55"/>
    </g>
    <g fill="none" stroke="#d6e4ec" stroke-width="8.5" stroke-linecap="round">
      <path d="M-42.75 -6.75A42.75 42.75 0 0 1 36.9 -21.6"/>
      <path d="M42.75 6.75A42.75 42.75 0 0 1 -36.9 21.6"/>
    </g>
    <g filter="url(#glow)">
      <path d="M-19 16L-5 -4.5 6.5 7 20 -15.5" fill="none" stroke="url(#hot)" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="20" cy="-15.5" r="5.2" fill="#5ff5dc"/>
    </g>
  </g>

  <!-- wordmark -->
  <g font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif">
    <text x="470" y="320" font-size="132" letter-spacing="-3" fill="#d6e4ec" font-weight="300">rift<tspan font-weight="800" fill="#2ee6c5">map</tspan></text>
    <text x="476" y="384" font-size="32" fill="#8fa6b3">An offline atlas of disclosed bug bounty reports</text>
    <text x="476" y="450" font-size="24" letter-spacing="2" fill="#5d7684">15,244 REPORTS  ·  428 PROGRAMS  ·  $4.93M IN BOUNTIES</text>
  </g>
</svg>
